services:
  app:
    build: .
    container_name: file-drive
    ports:
      - "8443:8443"
    env_file:
      - .env
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/certs/truststore.p12
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djavax.net.ssl.trustStoreType=PKCS12
      

      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/mydb;AUTO_SERVER=TRUE

      S3_ENDPOINT: https://minio:9000
      S3_ACCESS_KEY: ${MINIO_APP_USER}
      S3_SECRET_KEY: ${MINIO_APP_PASSWORD}
      S3_BUCKET: file-drive-bucket
      S3_QUARANTINE_BUCKET: file-drive-quarantine
      S3_LOCKBOX_BUCKET: ${S3_LOCKBOX_BUCKET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}

    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./certs/app/truststore.p12:/certs/truststore.p12:ro
      - ./certs/app/server-keystore.p12:/certs/app/server-keystore.p12:ro

    depends_on:
      - minio
      - minio-init
      - clamav
  frontend:
    build: ./frontend
    container_name: file-drive-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://localhost:8443}
      VITE_BACKEND_PROXY_TARGET: ${VITE_BACKEND_PROXY_TARGET:-https://app:8443}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app


  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    depends_on:
      - kes
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      MINIO_KMS_KES_ENDPOINT: https://kes:7373
      MINIO_KMS_KES_API_KEY: ${MINIO_KMS_KES_API_KEY}
      MINIO_KMS_KES_CAPATH: /certs/rootCA.crt
      MINIO_KMS_KES_KEY_NAME: file-drive-master-key
    ports:
      - "127.0.0.1:9000:9000"
      #- "9001:9001" # Web console
    volumes:
      - ./minio-data:/data
      - ./certs/minio/public.crt:/root/.minio/certs/public.crt:ro
      - ./certs/minio/private.key:/root/.minio/certs/private.key:ro
      - ./certs/rootCA.crt:/certs/rootCA.crt:ro

  kes:
    image: minio/kes:latest
    container_name: kes
    command: server --config /config/server-config.yml
    expose:
      - "7373"
    volumes:
      - ./kes/server-config.yml:/config/server-config.yml:ro
      - ./certs/kes/public.crt:/certs/public.crt:ro
      - ./certs/kes/private.key:/certs/private.key:ro
      - ./kes-data:/kes-data

  clamav:
    image: clamav/clamav:stable
    container_name: clamav
    restart: unless-stopped
    expose:
      - "3310"
    environment:
      CLAMD_CONF_StreamMaxLength: 500M
      CLAMD_CONF_MaxFileSize: 500M
      CLAMD_CONF_MaxScanSize: 500M
    volumes:
      - ./clamav-db:/var/lib/clamav

  # Create the bucket once MinIO is up
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        echo "Waiting for MinIO..."
        until mc alias set local https://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" --insecure; do
          sleep 2
        done

        echo "Creating buckets..."
        mc mb -p local/file-drive-bucket --insecure || true
        mc mb -p local/file-drive-quarantine --insecure || true
        mc mb -p local/file-drive-trash --insecure || true
        mc mb -p local/file-drive-lockbox --insecure || true

        echo "Configuring encryption..."
        mc admin kms key create local file-drive-master-key --insecure || true
        mc encrypt set sse-s3 local/file-drive-bucket --insecure || true
        mc encrypt set sse-s3 local/file-drive-trash --insecure || true
        mc encrypt set sse-s3 local/file-drive-lockbox --insecure || true

        echo "Disabling anonymous access..."
        mc anonymous set none local/file-drive-bucket --insecure || true
        mc anonymous set none local/file-drive-quarantine --insecure || true
        mc anonymous set none local/file-drive-trash --insecure || true
        mc anonymous set none local/file-drive-lockbox --insecure || true

        echo "Creating limited app policy..."
        cat > /tmp/filedrive-app-policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetBucketLocation",
                "s3:ListBucket",
                "s3:ListBucketMultipartUploads"
              ],
              "Resource": [
                "arn:aws:s3:::file-drive-bucket",
                "arn:aws:s3:::file-drive-quarantine",
                "arn:aws:s3:::file-drive-trash",
                "arn:aws:s3:::file-drive-lockbox"
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject",
                "s3:DeleteObject",
                "s3:AbortMultipartUpload",
                "s3:ListMultipartUploadParts"
              ],
              "Resource": [
                "arn:aws:s3:::file-drive-bucket/*",
                "arn:aws:s3:::file-drive-quarantine/*",
                "arn:aws:s3:::file-drive-trash/*",
                "arn:aws:s3:::file-drive-lockbox/*"
              ]
            }
          ]
        }
        EOF

        mc admin policy create local filedrive-app-policy /tmp/filedrive-app-policy.json --insecure || true

        echo "Creating limited MinIO app user..."
        mc admin user add local "$MINIO_APP_USER" "$MINIO_APP_PASSWORD" --insecure || true
        mc admin policy attach local filedrive-app-policy --user "$MINIO_APP_USER" --insecure || true

        echo "Buckets, encryption, private access, and app MinIO user are ready"
