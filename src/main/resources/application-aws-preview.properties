# Public HTTP preview runtime. Switch auth cookies back to Secure when HTTPS is added.
server.port=8080
server.ssl.enabled=false

spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# File and Lockbox operations remain unavailable in this preview profile until
# the MinIO-backed services have been migrated to the AWS S3 API.
s3.endpoint=http://127.0.0.1:9000
s3.access-key=disabled
s3.secret-key=disabled
s3.bucket=file-drive-preview-disabled
s3.lockbox-bucket=file-drive-preview-disabled-lockbox
s3.quarantine-bucket=file-drive-preview-disabled-quarantine
s3.trash-bucket=file-drive-preview-disabled-trash

app.webauthn.enabled=false
app.webauthn.rp-id=localhost
app.webauthn.origins=http://localhost

# Keep the disposable preview administrator aligned with its generated AWS secret.
app.bootstrap-admin.sync-password=true
