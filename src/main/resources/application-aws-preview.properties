# Public HTTP preview runtime. Switch auth cookies back to Secure when HTTPS is added.
server.port=8080
server.ssl.enabled=false

spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# The MinIO SDK speaks the S3 API. On ECS it obtains short-lived credentials
# from the task role instead of using long-lived access keys.
s3.endpoint=${S3_ENDPOINT:https://s3.eu-central-1.amazonaws.com}
s3.region=${S3_REGION:eu-central-1}
s3.use-iam-role=${S3_USE_IAM_ROLE:true}
s3.bucket=${S3_BUCKET}
s3.lockbox-bucket=${S3_LOCKBOX_BUCKET}
s3.quarantine-bucket=${S3_QUARANTINE_BUCKET}
s3.trash-bucket=${S3_TRASH_BUCKET}

app.webauthn.enabled=false
app.webauthn.rp-id=localhost
app.webauthn.origins=http://localhost

# Keep the disposable preview administrator aligned with its generated AWS secret.
app.bootstrap-admin.sync-password=true
